<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar libro</title>
</head>

<body>

    <h2>Eliminar libro</h2>
    <p>¿Estás seguro que deseas eliminar el libro "<strong>{{ libro.titulo }}</strong>"? Esta acción no se puede deshacer.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="color: black;">Sí, eliminar</button>
    </form>
    
    <br>

    <a href="{% url 'lista_libros' %}">Cancelar y volver al listado</a>

</body>

</html>
