<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar libro</title>
</head>

<body>

    <h1>Editar libro</h1>
    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Título:</label>
        <input
            type="text"
            name="titulo"
            value="{{ libro.titulo }}"
            required
        >

        <br><br>

        <label>Autor:</label>
        <input
            type="text"
            name="autor"
            value="{{ libro.autor }}"
            required
        >

        <br><br>

        <label>ISBN:</label>
        <input
            type="text"
            name="isbn"
            value="{{ libro.isbn }}"
            required
        >

        <br><br>

        <label>Fecha de publicación:</label>
        <input
            type="date"
            name="fecha_publicacion"
            value="{{ libro.fecha_publicacion|date:'Y-m-d' }}"
            required
        >

        <br><br>

        <label>Disponible:</label>
        <input
            type="checkbox"
            name="disponible"
            {% if libro.disponible %}checked{% endif %}
        >

        <br><br>

        <button type="submit">Guardar cambios</button>

    </form>

    <br>

    <a href="{% url 'lista_libros' %}">
        Volver al listado
    </a>

</body>

</html>
